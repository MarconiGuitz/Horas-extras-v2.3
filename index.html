<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Horas extras</title>
<link rel="manifest" href="manifest.json">
<style>
body{
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg,#ffffff,#000000);
    margin:0;padding:20px
}
.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    overflow:hidden
}
.header{
    background:linear-gradient(135deg,#000000,#82d8a6);
    color:#fff;
    padding:25px;
    text-align:center
}
.tabs{display:flex;background:#f1f1f1}
.tab{
    flex:1;padding:15px;border:none;
    background:none;font-weight:600;
    cursor:pointer;color:#666
}
.tab.active{
    background:#fff;
    color:#000000;
    border-bottom:3px solid #dbdbdb
}
.content{padding:20px}
.section{display:none}
.section.active{display:block}
label{font-weight:600;margin-bottom:5px;display:block}
input,select,textarea{
    width:100%;padding:12px;
    border-radius:10px;
    border:2px solid #eaeaea;
    margin-bottom:15px;
    font-size:16px;
    box-sizing:border-box
}
textarea{resize:vertical}
button{
    width:100%;padding:15px;
    border:none;border-radius:10px;
    background:linear-gradient(135deg,#000000,#979699);
    color:#fff;font-size:16px;
    font-weight:600;cursor:pointer;
    margin-bottom:10px
}
.btn-cerrar{background:linear-gradient(135deg,#7a0000,#c0392b)}
.resultado{
    background:linear-gradient(135deg,#b9c7b7,#599271);
    color:#fff;padding:20px;border-radius:15px
}
.resultado-item{
    display:flex;justify-content:space-between;
    padding:8px 0;border-bottom:1px solid rgba(255,255,255,.3)
}
.resultado-item:last-child{border:none;font-size:18px;font-weight:700}
.registro{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:10px}
small{color:#666}
hr{border:none;border-top:1px solid #eaeaea;margin:15px 0}
hr.white{border:none;border-top:1px solid rgba(255,255,255,.3);margin:15px 0}
.prestamo-box{
    background:#f0f7ff;
    border:2px solid #b3d4f5;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px
}
.toggle-row{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.toggle-row input[type=checkbox]{width:20px;height:20px;margin:0;cursor:pointer;accent-color:#000}
.toggle-row label{margin:0;cursor:pointer;font-size:16px}
.pagos-badge{
    display:inline-block;
    background:rgba(255,255,255,.25);
    border-radius:8px;
    padding:3px 8px;
    font-size:12px;
    margin-left:6px
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h2>💰 Calculadora de Horas Extras v3.2</h2>
<p> No hay que ser chucho ni dejar la vida por esta empresa</p>
</div>

<div class="tabs">
<button class="tab active" onclick="tab('config',this)">⚙️ Config</button>
<button class="tab" onclick="tab('registro',this)">➕ Registro</button>
<button class="tab" onclick="tab('historial',this)">📊 Historial</button>
<button class="tab" onclick="tab('resumen',this)">💵 Resumen</button>
</div>

<div class="content">

<!-- CONFIG -->
<div id="config" class="section active">

<label>Sueldo base mensual (Q)</label>
<input id="sueldoBase" type="number">



<label>IGSS (%)</label>
<input id="porcentajeIGSS" value="4.83">

<label>ISR (%)</label>
<input id="porcentajeISR" value="2.5893">

<hr>

<label>Ahorro mensual (Q)</label>
<input id="ahorroMensual" type="number" value="0">

<label>Ahorro acumulado actual (Q)</label>
<input id="ahorroAcumulado" type="number" value="0">

<hr>

<div class="toggle-row">
    <input type="checkbox" id="tienePrestamo" onchange="togglePrestamo()">
    <label for="tienePrestamo">💳 Tengo préstamo activo</label>
</div>

<div id="seccionPrestamo" class="prestamo-box" style="display:none">
    <label>Cuota fija mensual (Q)</label>
    <input id="prestamoCuota" type="number" value="886.58">

    <label>Interés del mes (Q) <small style="font-weight:400;color:#888">— actualizar cada mes</small></label>
    <input id="prestamoInteres" type="number" value="0">

    <label>Pagos restantes</label>
    <input id="prestamoPagos" type="number" value="14">
</div>

<button onclick="guardarConfig()">Guardar configuración</button>

</div>

<!-- REGISTRO -->
<div id="registro" class="section">
<label>Fecha</label>
<input id="fecha" type="date">

<label>Horas diurnas</label>
<input id="hd" type="number" step="0.5" value="0">

<label>Horas nocturnas</label>
<input id="hn" type="number" step="0.5" value="0">

<label>Motivo</label>
<textarea id="desc"></textarea>

<button onclick="registrar()">Registrar horas</button>
</div>

<!-- HISTORIAL -->
<div id="historial" class="section">
<div id="lista"></div>
</div>

<!-- RESUMEN -->
<div id="resumen" class="section">
<div id="resultado"></div>
</div>

</div>
</div>

<script>
let config={}, registros=[];

window.onload=()=>{
    fecha.valueAsDate=new Date();
    config=JSON.parse(localStorage.getItem('config')||'{}');
    registros=JSON.parse(localStorage.getItem('registros')||'[]');

    if(config.sueldoBase){
        sueldoBase.value=config.sueldoBase;
        porcentajeIGSS.value=config.porcentajeIGSS;
        porcentajeISR.value=config.porcentajeISR;
        ahorroMensual.value=config.ahorroMensual;
        ahorroAcumulado.value=config.ahorroAcumulado;

        if(config.tienePrestamo){
            tienePrestamo.checked=true;
            seccionPrestamo.style.display='block';
            prestamoCuota.value=config.prestamoCuota;
            prestamoInteres.value=config.prestamoInteres;
            prestamoPagos.value=config.prestamoPagos;
        }
    }
    mostrarHistorial();
};

function togglePrestamo(){
    seccionPrestamo.style.display=tienePrestamo.checked?'block':'none';
}

function tab(id,el){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    if(id==='resumen') resumen();
}

function guardarConfig(){
    config={
        sueldoBase:+sueldoBase.value,
        bono:250,
        porcentajeIGSS:+porcentajeIGSS.value,
        porcentajeISR:+porcentajeISR.value,
        ahorroMensual:+ahorroMensual.value,
        ahorroAcumulado:+ahorroAcumulado.value,
        tienePrestamo:tienePrestamo.checked,
        prestamoCuota:+prestamoCuota.value,
        prestamoInteres:+prestamoInteres.value,
        prestamoPagos:+prestamoPagos.value
    };
    localStorage.setItem('config',JSON.stringify(config));
    alert('Configuración guardada');
}

function cerrarMes(){
    if(!confirm('¿Cerrar el mes? Se actualizará el ahorro y el préstamo.')) return;

    // sumar ahorro mensual al acumulado
    config.ahorroAcumulado += config.ahorroMensual;

    // descontar un pago del préstamo si está activo
    if(config.tienePrestamo && config.prestamoPagos>0){
        config.prestamoPagos -= 1;
        config.prestamoInteres = 0; // resetear interés para el siguiente mes
        if(config.prestamoPagos===0){
            config.tienePrestamo=false;
            alert('🎉 ¡Préstamo liquidado! Se desactivará automáticamente.');
        }
    }

    localStorage.setItem('config',JSON.stringify(config));
    registros=[];
    localStorage.setItem('registros',JSON.stringify(registros));

    // actualizar UI
    ahorroAcumulado.value=config.ahorroAcumulado;
    tienePrestamo.checked=config.tienePrestamo;
    prestamoPagos.value=config.prestamoPagos;
    prestamoInteres.value=0;
    togglePrestamo();

    alert('✅ Mes cerrado correctamente');
    mostrarHistorial();
}

function registrar(){
    const tarifaBase=config.sueldoBase/30/8;
    registros.push({
        fecha:fecha.value,
        hd:+hd.value,
        hn:+hn.value,
        desc:desc.value,
        md:+hd.value*(tarifaBase*1.5),
        mn:+hn.value*(tarifaBase*2)
    });
    localStorage.setItem('registros',JSON.stringify(registros));
    hd.value=hn.value=0;desc.value='';
    mostrarHistorial();
}

function mostrarHistorial(){
    lista.innerHTML='';
    registros.forEach((r,i)=>{
        lista.innerHTML+=`
        <div class="registro">
            <b>${r.fecha}</b><br>
            ☀️ ${r.hd}h = Q${r.md.toFixed(2)}<br>
            🌙 ${r.hn}h = Q${r.mn.toFixed(2)}<br>
            <small>${r.desc}</small><br><br>
            <button onclick="eliminarRegistro(${i})"
                style="background:#b30000;color:#fff;border:none;border-radius:8px;
                       padding:8px 12px;cursor:pointer;font-size:14px;width:auto;margin:0">
                🗑️ Eliminar
            </button>
        </div>`;
    });
}

function eliminarRegistro(index){
    if(confirm('¿Deseas eliminar este registro?')){
        registros.splice(index,1);
        localStorage.setItem('registros',JSON.stringify(registros));
        mostrarHistorial();
    }
}

function resumen(){
    const bono=250;

    let horasD=registros.reduce((s,r)=>s+r.hd,0);
    let horasN=registros.reduce((s,r)=>s+r.hn,0);
    let totalD=registros.reduce((s,r)=>s+r.md,0);
    let totalN=registros.reduce((s,r)=>s+r.mn,0);
    let totalExtras=totalD+totalN;

    let dev=config.sueldoBase+bono+totalExtras;
    let devAfecto=config.sueldoBase+totalExtras; // base afecta (sin bono)

    let igss=devAfecto*(config.porcentajeIGSS/100);
    let isr=(devAfecto-igss)*(config.porcentajeISR/100);

    // préstamo
    let cuota=config.tienePrestamo?(config.prestamoCuota||0):0;
    let interes=config.tienePrestamo?(config.prestamoInteres||0):0;
    let pagosRestantes=config.prestamoPagos||0;
    let totalPrestamo=cuota+interes;

    let descuentosTotales=igss+isr+config.ahorroMensual+totalPrestamo;
    let primeraQuincena=dev/2;
    let segundaQuincena=dev-primeraQuincena-descuentosTotales;
    let netoMensual=primeraQuincena+segundaQuincena;

    let htmlPrestamo='';
    if(config.tienePrestamo){
        htmlPrestamo=`
        <div class="resultado-item">
            <span>💳 Cuota préstamo <span class="pagos-badge">${pagosRestantes} pagos restantes</span></span>
            <span>-Q${cuota.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>📈 Interés del mes</span>
            <span>-Q${interes.toFixed(2)}</span>
        </div>`;
    }

    resultado.innerHTML=`
    <div class="resultado" style="margin-bottom:15px">
        <div class="resultado-item" style="font-size:20px;font-weight:700">
            <span>🏦 Ahorro acumulado</span>
            <span>Q${config.ahorroAcumulado.toFixed(2)}</span>
        </div>
    </div>

    <div class="resultado">
        <div class="resultado-item">
            <span>Sueldo base</span>
            <span>Q${config.sueldoBase.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>📋 Bono 37-2001</span>
            <span>Q${bono.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>☀️ Horas diurnas (${horasD}h)</span>
            <span>Q${totalD.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>🌙 Horas nocturnas (${horasN}h)</span>
            <span>Q${totalN.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>Total horas extras</span>
            <span>Q${totalExtras.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>💰 Devengado mensual</span>
            <span>Q${dev.toFixed(2)}</span>
        </div>

        <hr class="white">

        <div class="resultado-item">
            <span>💸 1ª quincena (sin descuentos)</span>
            <span>Q${primeraQuincena.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>💸 2ª quincena (con descuentos)</span>
            <span>Q${segundaQuincena.toFixed(2)}</span>
        </div>

        <hr class="white">

        <div class="resultado-item">
            <span>IGSS (${config.porcentajeIGSS}%)</span>
            <span>-Q${igss.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>ISR (${config.porcentajeISR}%)</span>
            <span>-Q${isr.toFixed(2)}</span>
        </div>
        <div class="resultado-item">
            <span>Ahorro mensual</span>
            <span>-Q${config.ahorroMensual.toFixed(2)}</span>
        </div>
        ${htmlPrestamo}

        <div class="resultado-item" style="font-size:18px;font-weight:700">
            <span>✅ Líquido mensual</span>
            <span>Q${netoMensual.toFixed(2)}</span>
        </div>
    </div>
    <button class="btn-cerrar" onclick="cerrarMes()" style="margin-top:15px">📆 Cerrar mes</button>`;
}
</script>

</body>
</html>
